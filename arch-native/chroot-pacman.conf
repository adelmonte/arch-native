#
# /etc/pacman.conf — forge build chroot
#
# Artix [system]/[world]/[galaxy] come first: this chroot builds packages for an
# Artix target, and pacman resolves a name by repo order, not by version. When a
# package exists in both trees, the Artix build is the one the target system will
# install, so it must also be the one we link against.
#
# Arch [core]/[extra] follow as a fallback for packages Artix does not mirror.
#
# Getting this backwards silently produces soname mismatches: a dependency
# resolves to the Arch build at compile time while the target installs the Artix
# build at runtime. It is not caught by anything else here — artix-meson only
# fixes packaging layout (--sbindir=/usr/bin), and chroot_extra_packages only
# swaps systemd for elogind. Neither governs library provenance.
#
# The package cache below is deliberately NOT the host's /var/cache/pacman/pkg.
# arch-nspawn bind-mounts it into the container, and this host runs Arch while
# the chroot pulls Artix. Artix ships same-version rebuilds under identical
# filenames, so a shared cache hands pacman an Arch-built file to verify against
# an Artix signature — it reports the package as corrupted and the build dies at
# "Could not resolve all dependencies".
#
# Do not start a comment line with the cache directive's name: arch-nspawn
# rewrites every line matching ^#?\s*CacheDir when it enters the chroot, and
# will silently turn such a comment into a second, empty directive.
#
[options]
CacheDir    = /var/cache/arch-native/chroot-pkg/
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[system]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/artix-mirrorlist

[world]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/artix-mirrorlist

[galaxy]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/artix-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# CachyOS generic repo — provides build dependencies used in CachyOS PKGBUILDs
# (e.g. llvm-bolt, scx-scheduler-rs) that are not in Arch or Artix repos.
# Key fingerprint: 882DCFE48E2051D48E2562ABF3B607488DB35A47
[cachyos]
SigLevel = Required DatabaseOptional
Server = https://cdn77.cachyos.org/repo/$arch/$repo
