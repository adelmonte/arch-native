[arch-native]
# arch-native build-server config. Unset keys use the default shown in the
# comment. Inline comments (text after #) are allowed.

# Core
repo_name = forge          # pacman DB name + PACKAGER field
mode      = local          # local (build where you run) | remote (build server)
distro    = arch           # arch | artix (Artix chroot fixups)

# Build optimization  (shapes the generated makepkg.conf)
march     = native         # -march= CPU target; or explicit e.g. pantherlake
opt_level = 3              # -O level: 0 1 2 3 s g fast (also sets Rust opt-level)
lto       = true           # link-time optimization master switch
# ltoflags    = -flto=auto -falign-functions=32
# cflags_base = -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection -fno-semantic-interposition
# ldflags     = -Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs
# GCC 15 made some legacy C patterns hard errors; demote them so older packages
# still build. Remove when no longer needed.
extra_cflags  = -Wno-error=incompatible-pointer-types -Wno-error=discarded-qualifiers -Wno-error=implicit-function-declaration
lto_blacklist = llvm,rust  # build these with LTO off from the start (globs ok)

# Repository tiers
repo_priority = local,arch # resolution order; "local" = patches in pkgbuilds/local/
# tier_version_select = priority   # priority (first tier wins) | highest (highest pkgver)
# Each non-local tier needs <tier>_source. Built-ins: artix=clone gitea,
# cachyos=monorepo, arch=pkgctl. Types: clone <url> | monorepo | pkgctl.
# myfork_source = clone https://git.example.com/packages/{pkgname}.git

# Package selection
blacklist = gcc,glibc,glib2,coreutils,linux-api-headers,binutils,ttf-*,otf-*,font-*   # never built; globs ok
# always_build = pkg1,pkg2   # build + keep even when not installed (plain names)
# chroot_pacman_conf = /etc/arch-native/chroot-pacman.conf   # Artix: supply your own
# chroot_extra_packages = libelogind,libudev,elogind         # default set when distro=artix

# Build behavior
build_timeout = 14400      # per-build seconds; 0 disables (firefox needs 3h+)
download_retry_limit = 3   # re-queue transient download failures this many times
skip_pgp_on_import_failure = true   # retry --skippgpcheck if all key imports fail
# autoprune = true         # delete old pkg files after each rebuild
# autoprune_keep = 1       # versions kept per package (>=1)
# failed_stall_retries = 5 # mark "stalled" after N failures (with days rule)
# failed_stall_days = 7

# Timing & logging
poll_interval = 300        # main loop seconds
upstream_check_interval = 3600   # how often to git-pull upstream PKGBUILDs
log_retention_days = 7
log_level = INFO           # DEBUG | INFO | WARNING | ERROR

# Paths — default to /var/lib/arch-native/<subdir>; set only for a custom layout:
# chroot_dir chroot_root repo_dir repo_db pkgbuilds_dir makepkg_configs_dir
# manifest_path gnupg_home state_path pending_path failed_path log_dir
# metrics_path in_progress_path

# Per-package overrides (optional sections)
# [package_tiers]
# networkmanager = local,artix,arch
# [package_timeouts]
# firefox = 28800
